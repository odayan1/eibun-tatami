<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e6f78">
<title>読める英文 英検2級｜Q-UP英語塾</title>
<style>
:root{--main:#0e6f78;--main2:#17939e;--deep:#0a4a51;--soft:#e6f5f5;--acc:#ff6b57;--acc2:#ffe0db;--ink:#22303c;--bg:#f2f6f7;--ok:#1f9d55;--ng:#d64545;--gold:#d4a017;
  --cn:#228be6;--cnBg:rgba(34,139,230,.13);--ca:#2b9a66;--caBg:rgba(43,154,102,.15);--cd:#9c36b5;--cdBg:rgba(156,54,181,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;word-break:auto-phrase;line-break:strict}
.wrap{max-width:600px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(110deg,var(--deep),var(--main) 60%,var(--main2));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);flex:none}
header>div{min-width:0}
header .t1{font-size:11px;opacity:.85;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t2{font-weight:900;font-size:17px;letter-spacing:.02em}
header .t2 span{color:var(--acc)}
header .pt{white-space:nowrap;margin-left:auto;background:rgba(255,255,255,.16);padding:4px 11px;border-radius:99px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
header .hm{white-space:nowrap;background:none;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.card{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 2px 10px rgba(20,40,70,.07)}
h2{font-size:16px;margin:0 0 8px;color:var(--main);letter-spacing:.02em}
.muted{color:#6b7885;font-size:13px}
.en-s{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(135deg,var(--deep),var(--main) 55%,#138a93);color:#fff;border-radius:18px;padding:22px 18px 18px;margin-top:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,107,87,.22)}
.hero .en{font-size:12px;font-weight:800;letter-spacing:.22em;color:#ffd1c9}
.hero .jp{font-size:25px;font-weight:900;margin:6px 0 6px;line-height:1.4;position:relative;z-index:1}
.hero .jp span{color:var(--acc)}
.hero .sub{font-size:13.5px;opacity:.93;line-height:1.75;position:relative;z-index:1}
.hero .stat{display:inline-block;margin-top:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}
.bubble{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.bubble img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bubble div{background:#fff;border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:14px;line-height:1.7;box-shadow:0 2px 8px rgba(20,40,70,.07)}
/* guide */
.gdots{display:flex;gap:6px;justify-content:center;margin-top:14px}.gdots i{width:28px;height:5px;border-radius:9px;background:#d5dde3}.gdots i.on{background:var(--acc)}
.skip{display:block;margin:10px 0 0 auto;background:none;border:0;color:var(--main);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.pos{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;padding:11px 0;border-top:1px solid #edf0f3}
.pos:first-of-type{border-top:0}
.pos .tag{font-size:13px;font-weight:900;text-align:center;border-radius:10px;padding:7px 0;color:#fff}
.pos .d{font-size:14px;line-height:1.65}
.pos .ex{font-size:14px;color:#4a5866;margin-top:3px}
.t-v{background:var(--acc)}.t-n{background:var(--cn)}.t-a{background:var(--ca)}.t-d{background:var(--cd)}
.demo{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;font-size:17px;line-height:2.1;text-align:center}
.demo .lbl{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;color:#6b7885;line-height:1.3}
.w{display:inline-block;margin:0 3px;text-align:center;vertical-align:top;line-height:1.4}
.w small{display:block;font-size:10px;font-weight:900;letter-spacing:.04em}
.arrow{font-size:18px;color:var(--acc);font-weight:900;line-height:1.4;margin:2px 0}
.cn{color:var(--cn);font-weight:800}.ca{color:var(--ca);font-weight:800}.cd{color:var(--cd);font-weight:800}
.bn{background:var(--cnBg);border-radius:6px;padding:0 4px}.ba{background:var(--caBg);border-radius:6px;padding:0 4px}.bd{background:var(--cdBg);border-radius:6px;padding:0 4px}
.chunkrow{border-radius:12px;padding:12px;margin-top:10px;border:2px solid}
.chunkrow.n{border-color:var(--cn);background:var(--cnBg)}.chunkrow.a{border-color:var(--ca);background:var(--caBg)}.chunkrow.d{border-color:var(--cd);background:var(--cdBg)}
.chunkrow .hd{font-size:15px;font-weight:900}
.chunkrow .ds{font-size:13.5px;line-height:1.65;margin-top:3px}
.chunkrow .eg{font-size:15px;margin-top:6px;line-height:1.7}
.step4{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:11px 0;border-top:1px solid #edf0f3}
.step4:first-of-type{border-top:0}
.step4 .no{font-size:11px;font-weight:900;color:#fff;background:var(--main);border-radius:10px;text-align:center;padding:7px 2px;letter-spacing:.06em;line-height:1.3;height:fit-content}
.step4 .no b{display:block;font-size:18px}
.step4 .tt{font-weight:900;font-size:15px;color:var(--main)}
.step4 .tx{font-size:13.5px;line-height:1.7;margin-top:2px}
.why{background:var(--acc2);border-radius:10px;padding:9px 11px;margin-top:6px;font-size:13.5px;line-height:1.7}
.why b.h{color:var(--acc);letter-spacing:.08em}
.lvline{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.lvline span{font-size:11px;font-weight:900;letter-spacing:.1em;color:#fff;border-radius:6px;padding:4px 8px}
/* home */
.rule{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:14px;align-items:center}
.rule .k{font-size:20px;font-weight:900;text-align:center;border-radius:10px;padding:2px 0}
.kn{color:var(--cn);background:var(--cnBg)}.ka{color:var(--ca);background:var(--caBg)}.kd{color:var(--cd);background:var(--cdBg)}
.series{border-radius:14px;padding:14px;margin-top:12px;background:#fff;box-shadow:0 2px 10px rgba(20,40,70,.07);border-left:6px solid var(--main)}
.series .no{font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--acc)}
.series .nm{font-size:16px;font-weight:900;color:var(--main);margin:2px 0}
.series .fc{font-size:13px;color:#6b7885;font-family:system-ui,sans-serif}
.lvs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.lv{border:2px solid #dde3ea;background:#fff;border-radius:12px;padding:8px 2px;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink)}
.lv b{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--main)}
.lv small{display:block;font-size:10.5px;color:#6b7885;margin-top:1px}
.lv .rk{display:inline-block;margin-top:4px;font-size:12px;font-weight:900;border-radius:6px;padding:0 7px;color:#fff;background:#c3ccd5}
.rk.S{background:linear-gradient(135deg,#d4a017,#f5c542)}.rk.A{background:var(--acc)}.rk.B{background:var(--main2)}
.lv:active{transform:scale(.97)}
/* play */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:900;letter-spacing:.14em;color:#fff;background:var(--acc);border-radius:6px;padding:3px 9px}
.CORE{background:#5c6f7e}.BASIC{background:var(--main2)}.MEDIUM{background:var(--main)}.ADVANCED{background:linear-gradient(135deg,var(--deep),#3b2a7a)}
.wc{font-size:13px;font-weight:800;color:#6b7885}
.sname{font-size:12px;color:#6b7885;margin-left:auto}
.prog{display:flex;gap:4px;margin-top:10px}.prog i{flex:1;height:6px;border-radius:9px;background:#dfe5ec}.prog i.d{background:var(--main2)}.prog i.c{background:var(--acc)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 10px}
.steps div{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:6px 2px;border-radius:8px;background:#eef2f4;color:#98a4ae;line-height:1.3}
.steps div small{display:block;font-size:10px;font-weight:600;letter-spacing:0}
.steps div.on{background:var(--main);color:#fff}
.steps div.ok{background:var(--soft);color:var(--main)}
.steps div.na{opacity:.35}
.inst{font-size:15px;font-weight:800;color:var(--main);margin:2px 0 4px;line-height:1.5}
.inst .rem{background:var(--acc);color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;margin-left:4px}
.sentence{font-size:20px;line-height:2.45;padding:10px 2px 4px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.tok{display:inline-block;padding:0 5px;margin:0 1px;border-radius:7px;cursor:pointer;position:relative;transition:background .15s,color .15s;user-select:none;-webkit-user-select:none}
.tok:active{background:#e3eaee}
.tok.punct{cursor:default;padding:0 1px}
.tok.sel{background:#ffd8a8!important}
.tok.isV{color:var(--acc);font-weight:900}
.tok.isV:after{content:"V";position:absolute;left:50%;transform:translateX(-50%);top:-13px;font-size:11px;font-weight:900;color:#fff;background:var(--acc);border-radius:4px;padding:0 4px;line-height:1.35}
.tok.flash{animation:flash 1s ease 2}@keyframes flash{50%{background:#ffe066}}
.seg{transition:opacity .55s,filter .55s}
.seg.f-n{background:var(--cnBg);border-radius:7px}.seg.f-a{background:var(--caBg);border-radius:7px}.seg.f-d{background:var(--cdBg);border-radius:7px}
.br{font-weight:900;font-size:22px;padding:0 1px}
.br.n{color:var(--cn)}.br.a{color:var(--ca)}.br.d{color:var(--cd)}
.seg.fading{opacity:0;filter:blur(3px)}
.chipA{display:inline-block;background:var(--cn);color:#fff;border-radius:8px;padding:0 12px;font-weight:900;animation:pop .35s}
.typebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.typebtns button{border-radius:12px;padding:10px 4px;font-size:15px;font-weight:900;cursor:pointer;background:#fff;font-family:inherit}
.typebtns button small{display:block;font-size:11px;font-weight:700}
.tb-n{border:2px solid var(--cn);color:var(--cn)}.tb-a{border:2px solid var(--ca);color:var(--ca)}.tb-d{border:2px solid var(--cd);color:var(--cd)}
.tools{display:flex;gap:8px;margin-top:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.btn.main{background:var(--acc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);margin-top:14px}
.btn.main:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.sub{background:var(--soft);color:var(--main);margin-top:10px}
.tools .btn.sub{margin-top:0}
.btn.fold{background:linear-gradient(135deg,var(--deep),var(--main2));color:#fff;font-size:20px;letter-spacing:.2em;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.fb{border-radius:12px;padding:11px 13px;margin-top:12px;font-size:14px;line-height:1.7;display:none}
.fb.ok{background:#e7f6ee;display:block}.fb.ng{background:#fdecec;display:block}.fb.info{background:var(--soft);display:block}
.fb .h{font-weight:900;letter-spacing:.08em;margin-right:6px}
.fb.ok .h{color:var(--ok)}.fb.ng .h{color:var(--ng)}.fb.info .h{color:var(--main)}
/* parts (カタマリ一覧) */
.parts{margin-top:10px;display:grid;gap:8px}
.part{border-radius:12px;padding:10px 12px;border-left:6px solid;background:#fff;box-shadow:0 1px 6px rgba(20,40,70,.08);animation:pop .35s}
.part.n{border-color:var(--cn);background:linear-gradient(90deg,var(--cnBg),#fff 70%)}
.part.a{border-color:var(--ca);background:linear-gradient(90deg,var(--caBg),#fff 70%)}
.part.d{border-color:var(--cd);background:linear-gradient(90deg,var(--cdBg),#fff 70%)}
.part .lab{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.part.n .lab{background:var(--cn)}.part.a .lab{background:var(--ca)}.part.d .lab{background:var(--cd)}
.part .en{font-size:16.5px;font-weight:800;margin-top:5px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.part.n .en b{color:var(--cn)}.part.a .en b{color:var(--ca)}.part.d .en b{color:var(--cd)}
.part .jp{font-size:15px;font-weight:900;margin-top:3px}
.part .rl{font-size:12.5px;color:#4a5866;margin-top:2px}
.skel{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:10px 0 4px}
.skel .p{text-align:center;animation:pop .4s both}
.skel .w2{font-size:22px;font-weight:900;padding:4px 12px;border-radius:10px;background:var(--soft);color:var(--main);font-family:system-ui,sans-serif}
.skel .w2.v{background:var(--acc2);color:var(--acc)}
.skel .w2.A{background:var(--cn);color:#fff}
.skel .r{font-size:11px;font-weight:900;color:#98a4ae;margin-top:3px;letter-spacing:.1em}
.amean{background:var(--cnBg);border:2px solid var(--cn);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:14px;line-height:1.65}
.amean b{color:var(--cn)}
.shrink{font-size:14px;font-weight:800;color:var(--main);margin-top:8px}
.shrink b{font-size:22px;color:var(--acc);font-variant-numeric:tabular-nums}
.choices{display:grid;gap:9px;margin-top:10px}
.choices button{border:2px solid #dde3ea;background:#fff;border-radius:12px;padding:12px 13px;font-size:15px;font-weight:700;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.55}
.choices button.ok{border-color:var(--ok);background:#e7f6ee}
.choices button.ng{border-color:var(--ng);background:#fdecec}
.choices button:disabled{cursor:default;color:var(--ink)}
.notes{margin:6px 0 0;padding-left:18px}.notes li{margin:5px 0;line-height:1.7;font-size:14px}
.sec{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--acc);margin-top:18px}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;letter-spacing:.06em;pointer-events:none;z-index:30;opacity:0;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.toast.go{animation:toast .9s ease-out}
.toast small{display:block;font-size:15px;text-align:center;letter-spacing:.12em}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.score{text-align:center;font-size:52px;font-weight:900;color:var(--main);margin:2px 0;font-variant-numeric:tabular-nums}
.score small{font-size:18px}
.rrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #edf0f3;font-size:14px}
.rrow .rk{font-size:16px;padding:1px 10px;border-radius:8px;color:#fff;font-weight:900}
.maxlen{text-align:center;margin-top:8px;font-weight:900;color:var(--acc);font-size:16px;letter-spacing:.04em}
footer{font-size:11px;color:#8a949e;line-height:1.6;margin-top:24px;text-align:center}
#cf{position:fixed;inset:0;pointer-events:none;z-index:20}
.hide{display:none!important}
.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>

  </div>`;
  $("#hintBtn").onclick = hint; $("#clearBtn").onclick = clearSel; $("#foldBtn").onclick = fold;
  document.querySelectorAll("#typeBtns button").forEach(b => b.onclick = () => pickType(b.dataset.t));
  steps(0); $("#inst").innerHTML = core ? "まずは骨格だけの文。文の動詞（V）をタップ" : "文全体の動詞（V）をタップ";
  render(); scrollTo(0,0);
}
function steps(k){ [...$("#steps").children].forEach((d,i) => { const na = d.classList.contains("na"); d.className = (i < k ? "ok" : i === k ? "on" : "") + (na ? " na" : ""); }); }
function fb(cls, head, html){ const f = $("#fb"); f.className = "fb" + (cls ? " " + cls : ""); f.innerHTML = cls ? `<span class="h">${head}</span>${html}` : ""; }

function render(){
  const p = P[S.pi]; let h = "", i = 0;
  while (i < p.tokens.length){
    const ci = chunkOf(p,i);
    if (ci >= 0){
      const c = p.chunks[ci], f = S.found.has(ci);
      h += `<span class="seg${f ? " f-" + c.t : ""}" data-ci="${ci}">`;
      if (f) h += `<span class="br ${c.t}">${esc(symO[c.t])}</span>`;
      for (let k = c.s; k <= c.e; k++) h += tok(p,k);
      if (f) h += `<span class="br ${c.t}">${esc(symC[c.t])}</span>`;
      h += `</span> `; i = c.e + 1;
    } else { h += tok(p,i) + " "; i++; }
  }
  $("#sentence").innerHTML = h.replace(/ (<span class="tok punct)/g, "$1");
  document.querySelectorAll("#sentence .tok").forEach(el => el.onclick = () => onTok(+el.dataset.i));
}
function tok(p,k){
  const t = p.tokens[k]; let c = "tok";
  if (isPunct(t)) c += " punct";
  if (k === p.verb && S.phase !== "verb") c += " isV";
  if (S.selS !== null){ const a = Math.min(S.selS, S.selE ?? S.selS), b = Math.max(S.selS, S.selE ?? S.selS); if (k >= a && k <= b) c += " sel"; }
  return `<span class="${c}" data-i="${k}">${esc(t)}</span>`;
}
function flash(a,b){ for (let k = a; k <= b; k++){ const el = document.querySelector(`#sentence .tok[data-i="${k}"]`); if (el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } } }

function onTok(i){
  const p = P[S.pi], t = p.tokens[i];
  if (isPunct(t)) return;
  if (S.phase === "verb"){
    if (i === p.verb){
      hit(10); S.hint = 0;
      if (p.chunks.length === 0){ S.phase = "done"; render(); coreDone(); return; }
      S.phase = "chunk"; steps(1);
      fb("ok", "NICE!", `<b>${esc(t)}</b> が文の V。V 以外の部分に、修飾のカタマリが付いている。`);
      render(); inst(); return;
    }
    miss();
    if (chunkOf(p,i) >= 0) fb("ng", "MISS", `<b>${esc(t)}</b> はカタマリの内部にある語。カタマリの中の動詞は、文の V にはならない。`);
    else fb("ng", "MISS", `<b>${esc(t)}</b> は文の V ではない。もう一度。`);
    return;
  }
  if (S.phase === "chunk"){
    const ci = chunkOf(p,i);
    if (ci >= 0 && S.found.has(ci)){ fb("info", "INFO", "そこは括り済み。残りのカタマリを探そう。"); return; }
    if (S.selS === null || S.selE !== null){ S.selS = i; S.selE = null; $("#typeBtns").classList.add("hide"); }
    else { S.selE = i; $("#typeBtns").classList.remove("hide"); }
    $("#clearBtn").classList.remove("hide");
    render(); inst();
  }
}
function skelHtml(p){
  return `<div class="skel">${p.skel.map(([w,r],k) => `<div class="p" style="animation-delay:${k*.12}s"><div class="w2${r === "V" ? " v" : ""}${w === "[A]" ? " A" : ""}">${esc(w)}</div><div class="r">${r}</div></div>`).join("")}</div>`;
}
function coreDone(){
  const p = P[S.pi];
  $("#tools").classList.add("hide"); steps(4);
  fb("ok", "NICE!", `<b>${esc(p.tokens[p.verb])}</b> が文の V。これが骨格。`);
  $("#inst").innerHTML = "骨格（CORE）";
  $("#after").innerHTML = skelHtml(p) + `<div class="sec">POINT</div><ul class="notes">${p.notes.map(n => `<li>${n}</li>`).join("")}</ul>`;
  finishOne();
}
const left = () => P[S.pi].chunks.length - S.found.size;
function inst(){
  const n = `<span class="rem">残り ${left()}</span>`;
  if (S.selS === null) $("#inst").innerHTML = `カタマリの<b>始点</b>をタップ ${n}`;
  else if (S.selE === null) $("#inst").innerHTML = `カタマリの<b>終点</b>をタップ（1語なら同じ語をもう一度） ${n}`;
  else $("#inst").innerHTML = `このカタマリの種類は？ ${n}`;
}
function clearSel(){ S.selS = null; S.selE = null; $("#typeBtns").classList.add("hide"); $("#clearBtn").classList.add("hide"); render(); inst(); }

function pickType(t){
  const p = P[S.pi], s = Math.min(S.selS, S.selE), e = Math.max(S.selS, S.selE);
  const m = p.chunks.findIndex((c,ci) => !S.found.has(ci) && c.s === s && c.e === e);
  if (m >= 0){
    const c = p.chunks[m];
    if (c.t === t){
      S.found.add(m); S.selS = null; S.selE = null; S.hint = 0; hit(20);
      $("#typeBtns").classList.add("hide"); $("#clearBtn").classList.add("hide");
      fb("ok", "GREAT!", `${tName[t]}のカタマリ ── ${esc(c.why)}。`);
      render(); listFound();
      if (left() === 0) toFold(); else inst();
    } else {
      miss();
      fb("ng", "ALMOST", `範囲は正確。種類を再判定しよう ── このカタマリは「${esc(c.why)}」。`);
    }
    return;
  }
  miss();
  const over = p.chunks.some((c,ci) => !S.found.has(ci) && !(e < c.s || s > c.e));
  fb("ng", "MISS", over ? "惜しい。カタマリの<b>始点</b>か<b>終点</b>がずれている。" : "そこはカタマリではない（骨格の一部の可能性）。");
  S.selS = null; S.selE = null; $("#typeBtns").classList.add("hide"); render(); inst();
}
function partHtml(p,c){
  return `<div class="part ${c.t}"><span class="lab">${esc(symO[c.t] + " " + symC[c.t])}　${tName[c.t]}のカタマリ</span>
    <div class="en"><b>${esc(symO[c.t])}</b> ${esc(chunkText(p,c))} <b>${esc(symC[c.t])}</b></div>
    <div class="jp">「${esc(c.ja)}」</div><div class="rl">役割：${esc(c.why)}</div></div>`;
}
function listFound(){
  const p = P[S.pi];
  $("#found").innerHTML = [...S.found].sort((a,b) => p.chunks[a].s - p.chunks[b].s).map(ci => partHtml(p, p.chunks[ci])).join("");
}
function hint(){
  const p = P[S.pi]; miss(); S.hint++;
  if (S.phase === "verb"){
    if (S.hint === 1) fb("info", "HINT", "動詞が複数あるときは、<b>カタマリの外にある動詞</b>が V。関係代名詞（who / that）・接続詞（after / because）・分詞（-ing / 過去分詞）の後ろは、カタマリの内部である可能性が高い。");
    else { fb("info", "HINT", "光っている語が V。"); flash(p.verb, p.verb); }
  } else if (S.phase === "chunk"){
    const c = p.chunks.find((c,k) => !S.found.has(k));
    if (S.hint === 1){ fb("info", "HINT", "光っている語から、カタマリが始まる。"); flash(c.s, c.s); }
    else { fb("info", "HINT", `光っている範囲がカタマリ。種類は「${esc(c.why)}」から判断しよう。`); flash(c.s, c.e); }
  }
}

/* ===================== FOLD ===================== */
function toFold(){
  S.phase = "fold"; steps(2);
  $("#inst").innerHTML = "全カタマリ確保。<b>FOLD</b> で骨格だけを残せ";
  $("#tools").classList.add("hide"); $("#foldBtn").classList.remove("hide");
}
function fold(){
  const p = P[S.pi]; $("#foldBtn").classList.add("hide");
  document.querySelectorAll("#sentence .seg").forEach(seg => {
    const c = p.chunks[+seg.dataset.ci]; seg.classList.add("fading");
    setTimeout(() => {
      if (c.t === "n"){ seg.className = "seg"; seg.innerHTML = `<span class="chipA">[ A ]</span>`; }
      else { seg.style.display = "none"; [seg.previousElementSibling, seg.nextElementSibling].forEach(el => { if (el && el.classList.contains("punct") && el.textContent === ",") el.style.display = "none"; }); }
    }, 560);
  });
  const core = p.skel.reduce((n,[w]) => n + (w === "[A]" ? 1 : w.split(" ").length), 0);
  setTimeout(() => {
    toast("FOLD!", `${p.words} → ${core} words`, "#0e6f78");
    S.phase = "meaning"; steps(3); fb("", "", "");
    $("#found").innerHTML = "";
    $("#inst").innerHTML = "骨格";
    const parts = p.chunks.slice().sort((a,b) => a.s - b.s);
    $("#after").innerHTML = `${skelHtml(p)}
      ${p.A ? `<div class="amean">${p.A}</div>` : ""}
      <div class="shrink"><b>${p.words}</b> words → <b>${core}</b> words</div>
      <div class="sec">PARTS ── カタマリの役割</div>
      <div class="parts">${parts.map(c => partHtml(p,c)).join("")}</div>
      <div class="sec">04 MEANING</div><div class="inst">骨格＋カタマリから、元の英文の意味を選べ</div>
      <div class="choices" id="choices">${shuffle([0,1,2,3]).map(k => `<button data-k="${k}">${esc(p.choices[k])}</button>`).join("")}</div>
      <div id="exp"></div>`;
    document.querySelectorAll("#choices button").forEach(b => b.onclick = () => choose(+b.dataset.k));
  }, 650);
}
function choose(k){
  const p = P[S.pi];
  document.querySelectorAll("#choices button").forEach(b => { b.disabled = true; if (+b.dataset.k === 0) b.classList.add("ok"); else if (+b.dataset.k === k) b.classList.add("ng"); });
  if (k === 0){ hit(30); fb("ok", "PERFECT!", "骨格が見えれば、長い文も一直線に読める。"); }
  else { miss(); fb("ng", "MISS", "緑が正解。骨格（S・V・O）と、各カタマリが何を修飾しているかを確認しよう。"); }
  steps(4);
  $("#exp").innerHTML = `<div class="sec">EXPLANATION</div><ul class="notes">${p.notes.map(n => `<li>${n}</li>`).join("")}</ul>`;
  finishOne();
}
function finishOne(){
  const p = P[S.pi];
  const r = rankOf(S.miss);
  if (!save.rank[S.pi] || RORD[r] > RORD[save.rank[S.pi]]) save.rank[S.pi] = r;
  if (r !== "B") save.best = Math.max(save.best, p.words);
  S.run.push({ pi:S.pi, r }); persist();
  const last = p.stage === 3;
  const b = document.createElement("button"); b.className = "btn main"; b.id = "next";
  b.textContent = last ? "RESULT ▶" : `NEXT ── ${LV[p.stage+1]} ▶`;
  b.onclick = () => last ? result() : start(S.pi + 1);
  $("#after").appendChild(b);
}

/* ===================== 結果 ===================== */
function result(){
  const p = P[S.pi];
  save.pts = Math.max(save.pts, S.runPts); persist();
  const maxW = Math.max(0, ...S.run.filter(x => x.r !== "B").map(x => P[x.pi].words));
  const allTop = S.run.length && S.run.every(x => x.r !== "B"), allS = S.run.length && S.run.every(x => x.r === "S");
  const cmt = allS ? "Perfect! カタマリの量に惑わされず、骨格を一発で見抜けていますね。次のシリーズへ！"
    : allTop ? "Good job! 長い文でも骨格はシンプル。この感覚を、本番の長文でもそのまま使いましょう。"
    : "長さに押されたら、まず<b>カタマリの外の動詞</b>を探すところから。もう一度チャレンジ！";
  app.innerHTML = `<div class="card pop" style="text-align:center">
      <div class="sec" style="margin-top:0">SERIES 0${p.series+1} ── RESULT</div>
      <div style="font-weight:900;color:var(--main);font-size:17px;margin-top:4px">${SERIES[p.series].name}</div>
      <div class="score">${S.runPts}<small> pt</small></div>
      ${maxW ? `<div class="maxlen">${maxW} words の英文を攻略！</div>` : ""}
    </div>
    <div class="card">${S.run.map(x => `<div class="rrow"><span><b style="letter-spacing:.1em;color:var(--main)">${LV[P[x.pi].stage]}</b>　${P[x.pi].words} words</span><span class="rk ${x.r}">${x.r}</span></div>`).join("")}</div>
    ${bubble(cmt)}
    <button class="btn main" id="again">もう一度</button>
    ${p.series < SERIES.length - 1 ? `<button class="btn sub" id="nextS">次のシリーズへ ▶</button>` : ""}
    <button class="btn sub" id="toHome">HOME</button>`;
  $("#again").onclick = () => { S.run = []; S.runPts = 0; S.combo = 0; start(P.findIndex(q => q.series === p.series && q.stage === 0)); };
  if ($("#nextS")) $("#nextS").onclick = () => { S.run = []; S.runPts = 0; S.combo = 0; start(P.findIndex(q => q.series === p.series + 1 && q.stage === 0)); };
  $("#toHome").onclick = home;
  $("#hm").classList.add("hide");
  scrollTo(0,0); if (allTop) confetti(allS);
}
function confetti(gold){
  const c = $("#cf"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = gold ? ["#d4a017","#f5d061","#fff1b8","#b8860b"] : ["#ff6b57","#17939e","#1f9d55","#f5d061","#0e6f78"];
  const Q = Array.from({ length:140 }, () => ({ x:Math.random()*c.width, y:-20 - Math.random()*c.height, v:2 + Math.random()*3, r:Math.random()*6.28, s:5 + Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)] }));
  let f = 0; (function loop(){ x.clearRect(0,0,c.width,c.height); Q.forEach(p => { p.y += p.v; p.r += .1; x.save(); x.translate(p.x + Math.sin(p.r)*8, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); }); if (++f < 260) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height); })();
}

/* HOME（途中は2回タップで戻る） */
let armed = false;
$("#hm").onclick = () => {
  const mid = S.phase !== "meaning" && S.phase !== "done";
  if (mid && !armed){ armed = true; $("#hm").textContent = "もう一度タップ"; setTimeout(() => { armed = false; $("#hm").textContent = "HOME"; }, 2500); return; }
  armed = false; $("#hm").textContent = "HOME"; home();
};

window.__T = { P, S, onTok, pickType, choose, fold, guide, home };
guide(0);
</script>
</body>
</html>
